name: aibot hello-world responder

# Runs whenever someone comments on an issue.
# This is a self-contained alternative to the hosted GitHub App —
# useful for demoing the concept inside a single repo with zero hosting.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reply:
    if: contains(github.event.comment.body, '@aibot') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Reply with issue details
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;

            const labels = issue.labels.map(l => l.name).join(', ') || 'none';

            const body = [
              `👋 Hi @${comment.user.login}, aibot here!`,
              ``,
              `**Issue:** ${issue.title}`,
              `**Opened by:** @${issue.user.login}`,
              `**Labels:** ${labels}`,
              ``,
              `_This is a hello-world reply from the GitHub Action version — real fix suggestions are coming in the next iteration._`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
