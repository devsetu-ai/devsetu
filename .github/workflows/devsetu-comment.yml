name: DevSetu AI Issue Responder

# Runs whenever someone comments on an issue tagging @devsetu or @aibot.
# Powered by Google Gemini 3.5 Flash.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reply:
    if: github.event.comment && (contains(github.event.comment.body, '@devsetu') || contains(github.event.comment.body, '@aibot')) && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Reply with DevSetu
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const repo = context.repo;
            const apiKey = process.env.GEMINI_API_KEY;

            let replyBody = '';

            if (!apiKey) {
              const labels = issue.labels.map(l => l.name).join(', ') || 'none';
              replyBody = [
                `👋 Hi @${comment.user.login}, DevSetu here!`,
                ``,
                `**Issue:** ${issue.title}`,
                `**Opened by:** @${issue.user.login}`,
                `**Labels:** ${labels}`,
                ``,
                `*(Add GEMINI_API_KEY secret to enable Gemini 3.5 Flash replies)*`,
              ].join('\n');
            } else {
              const prompt = [
                `You are DevSetu, a senior software engineer and professional GitHub AI assistant powered by Google Gemini 3.5 Flash.`,
                `A developer has tagged you in an issue discussion.`,
                ``,
                `Response Guidelines:`,
                `- Tone: Highly professional, objective, concise, and solution-driven.`,
                `- Structure: Organize with clear Markdown headings and tasteful contextual emojis (e.g., 📌 Summary, 🔍 Technical Analysis, 💡 Recommended Solution, ⚠️ Considerations, 🚀 Next Steps).`,
                `- Clarity: Provide clear syntax-highlighted code blocks, actionable CLI commands, or precise diffs where applicable.`,
                `- Salutation: Address the user politely (e.g., "Hello @${comment.user.login},").`,
                ``,
                `Repository: ${repo.owner}/${repo.repo}`,
                `Issue #${issue.number}: ${issue.title}`,
                `Issue Author: @${issue.user.login}`,
                `Labels: ${issue.labels.map(l => l.name).join(', ') || 'none'}`,
                `Issue Description:`,
                `${issue.body || '(no description provided)'}`,
                ``,
                `User Comment from @${comment.user.login}:`,
                `${comment.body}`,
                ``,
                `Provide your professional response below. End with:`,
                `> ⚡ *Powered by Gemini 3.5 Flash (DevSetu)*`
              ].join('\n');

              try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                      temperature: 0.7,
                      maxOutputTokens: 2048,
                    },
                  }),
                });

                if (res.ok) {
                  const data = await res.json();
                  replyBody = data.candidates?.[0]?.content?.parts?.[0]?.text;
                } else {
                  const errText = await res.text();
                  console.error('Gemini API error:', errText);
                }
              } catch (err) {
                console.error('Error calling Gemini:', err);
              }

              if (!replyBody) {
                replyBody = `👋 Hi @${comment.user.login}! I encountered an issue calling Gemini 3.5 Flash.`;
              }
            }

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issue.number,
              body: replyBody,
            });
