# GitHub App Manifest
# Used by Probot's manifest flow (https://YOUR_APP_URL/probot) to
# register the app in one click instead of filling the form by hand.

name: aibot
description: Replies to @aibot mentions on issues with issue details (hello-world starter)
url: https://example.com
hook_attributes:
  url: https://example.com/api/github/webhooks
redirect_url: https://example.com/probot/setup
public: false
default_permissions:
  issues: write
  metadata: read
  contents: read
default_events:
  - issue_comment
